# Site-specific Nexmoe configuration. Keep theme defaults in node_modules.
avatar: /static/avatar.jpg
favicon:
  href: /static/favicon.ico
  type: image/x-icon

background:
  path: /static/background.jpg
  width: 1440
  height: 960

function:
  globalToc: true
  wordCount: true
  copyCode: true

imageCDN:
  enable: false

cdn:
  mdui:
    js: /static/libs/mdui.min.js
  jquery:
    js: /static/libs/jquery.min.js
  fancybox:
    css: /static/libs/fancybox.css
    js: /static/libs/fancybox.umd.js
  justifiedGallery:
    css: /static/libs/justifiedGallery.min.css
    js: /static/libs/jquery.justifiedGallery.min.js

customStyles:
  - custom.css

jsonContent:
  meta: false
  pages: false
  posts:
    title: true
    date: false
    path: true
    text: true
    raw: false
    content: false
    slug: false
    updated: false
    comments: false
    link: false
    permalink: false
    excerpt: false
    categories: false
    tags: false

menu:
  首页:
    - /
    - icon-home
  文章归档:
    - /archive.html
    - icon-container
  关于我:
    - /about.html
    - icon-info-circle

widgets:
  - name: search
    enable: true
    options:
      search:
        type: local
  - name: category
    enable: true
  - name: recent_posts
    enable: true
  - name: archive
    enable: true
    options:
      widgetAchive:
        archive_type: year
        show_count: true

# Remove theme demo integrations and third-party advertising from the personal site.
slotHead: false
slotFooter: false
slotSidebar: ''
slotComment: false
slotArticleEnd: false
